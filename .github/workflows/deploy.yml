name: Deploy to Streamlit Cloud

on:
  push:
    branches: 
      - main
      - develop
  pull_request:
    branches: 
      - main
    types: [opened, synchronize, reopened]

env:
  PYTHON_VERSION: '3.10'

jobs:
  # Code Quality and Testing
  quality-check:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
          
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest black isort
        pip install -r requirements.txt
        
    - name: Code formatting check with Black
      run: |
        black --check --diff .
        
    - name: Import sorting check with isort
      run: |
        isort --check-only --diff .
        
    - name: Lint with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        
    - name: Security check with bandit
      run: |
        pip install bandit
        bandit -r . -f json -o bandit-report.json || true
        
    - name: Upload security report
      uses: actions/upload-artifact@v3
      with:
        name: bandit-security-report
        path: bandit-report.json

  # Test Application
  test:
    runs-on: ubuntu-latest
    needs: quality-check
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']
        
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-${{ matrix.python-version }}-
          ${{ runner.os }}-pip-
          
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov
        pip install -r requirements.txt
        
    - name: Test data loading functionality
      run: |
        python -c "
        import sys
        sys.path.append('.')
        try:
            from utils.data_loader import load_stock_data
            print('✅ Data loader import successful')
        except Exception as e:
            print(f'❌ Data loader import failed: {e}')
            sys.exit(1)
        "
        
    - name: Test model imports
      run: |
        python -c "
        import sys
        sys.path.append('.')
        try:
            from models.prophet_model import run_prophet
            from models.darts_model import run_darts
            print('✅ Model imports successful')
        except Exception as e:
            print(f'❌ Model imports failed: {e}')
            sys.exit(1)
        "
        
    - name: Run pytest (if test files exist)
      run: |
        if [ -d "tests" ]; then
          pytest tests/ -v --cov=. --cov-report=xml
        else
          echo "No tests directory found, skipping pytest"
        fi

  # Validate Streamlit App
  validate-app:
    runs-on: ubuntu-latest
    needs: [quality-check, test]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Validate Streamlit app structure
      run: |
        # Check if main.py exists
        if [ ! -f "app/main.py" ]; then
          echo "❌ app/main.py not found"
          exit 1
        fi
        echo "✅ app/main.py found"
        
        # Check if requirements.txt has streamlit
        if ! grep -q "streamlit" requirements.txt; then
          echo "❌ streamlit not found in requirements.txt"
          exit 1
        fi
        echo "✅ streamlit found in requirements.txt"
        
    - name: Validate Streamlit app syntax
      run: |
        python -m py_compile app/main.py
        python -m py_compile app/ui.py
        python -m py_compile app/predictor.py
        echo "✅ Streamlit app syntax validation passed"
        
    - name: Check for secrets/API keys in code
      run: |
        # Check for hardcoded API keys (basic check)
        if grep -r "sk-" . --exclude-dir=.git --exclude="*.md" --exclude="*.yml" --exclude="*.yaml"; then
          echo "❌ Potential API key found in code"
          exit 1
        fi
        echo "✅ No hardcoded API keys detected"

  # Deploy to Streamlit Cloud
  deploy:
    runs-on: ubuntu-latest
    needs: [quality-check, test, validate-app]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Create deployment artifact
      run: |
        # Create a deployment summary
        echo "🚀 Deployment Summary" > deployment-summary.md
        echo "- **Commit**: ${{ github.sha }}" >> deployment-summary.md
        echo "- **Branch**: ${{ github.ref_name }}" >> deployment-summary.md
        echo "- **Timestamp**: $(date)" >> deployment-summary.md
        echo "- **Python Version**: ${{ env.PYTHON_VERSION }}" >> deployment-summary.md
        
    - name: Upload deployment artifact
      uses: actions/upload-artifact@v3
      with:
        name: deployment-info
        path: deployment-summary.md
        
    - name: Streamlit Cloud Deployment
      run: |
        echo "🌟 Streamlit Cloud Deployment Process"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "✅ Code quality checks passed"
        echo "✅ Tests completed successfully"
        echo "✅ App validation successful"
        echo "📦 Ready for Streamlit Cloud deployment"
        echo ""
        echo "🔗 Streamlit Cloud will automatically deploy from this repository"
        echo "🌐 App URL: https://share.streamlit.io/[your-username]/[your-repo]/main/app/main.py"
        echo ""
        echo "📝 Manual Steps for Streamlit Cloud Setup:"
        echo "1. Go to https://share.streamlit.io/"
        echo "2. Connect your GitHub repository"
        echo "3. Set main file path to: app/main.py"
        echo "4. Add GOOGLE_API_KEY to Streamlit secrets"
        echo "5. Deploy!"
        
    - name: Notify deployment status
      if: always()
      run: |
        if [ "${{ job.status }}" == "success" ]; then
          echo "🎉 Deployment pipeline completed successfully!"
        else
          echo "❌ Deployment pipeline failed!"
          exit 1
        fi

  # Cleanup and Notifications
  cleanup:
    runs-on: ubuntu-latest
    needs: [deploy]
    if: always()
    
    steps:
    - name: Cleanup artifacts
      run: |
        echo "🧹 Cleanup completed"
        
    - name: Send notification (optional)
      if: github.ref == 'refs/heads/main'
      run: |
        echo "📧 Deployment notification sent"
        # Add your notification logic here (Slack, Discord, Email, etc.)
        # Example:
        # curl -X POST -H 'Content-type: application/json' \
        #   --data '{"text":"🚀 Stock Prediction App deployed successfully!"}' \
        #   $SLACK_WEBHOOK_URL